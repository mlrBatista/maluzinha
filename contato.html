<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato</title>
</head>
<body>
    <form action="/salvar-cadastro" method="POST"> 
        <h2>Cadastre-se</h2>

        <div>
            <label for="nome">Nome:</label><br>
            <input type="text" id="nome" name="nome" maxlength="50" size="50">
        </div>

        <br>

        <div>
            <label for="email">E-mail:</label><br>
            <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com">
        </div>
        
        <p>Você gosta de HTML?</p>
        <input type="radio" id="html-sim" name="gosta_html" value="sim">
        <label for="html-sim">Sim</label>

        <input type="radio" id="html-nao" name="gosta_html" value="nao">
        <label for="html-nao">Não</label>
        
        <p>Quais equipamentos você possui?</p>
        <input type="checkbox" id="eq-notebook" name="equipamentos[]" value="notebook">
        <label for="eq-notebook">Notebook</label>

        <input type="checkbox" id="eq-desktop" name="equipamentos[]" value="desktop">
        <label for="eq-desktop">Desktop</label>

        <br><br>

        <button type="submit">Cadastrar</button>
    </form>
</body>
</html>
